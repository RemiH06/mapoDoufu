[project]
name = "mapo-core"
version = "0.1.0"
description = "Motor de datos y decision de Mapo: VRP, isocronas, cliente de la API de Gaiarda"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapo_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"