<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapo</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=barlow:400,500,600|barlow-condensed:500,700|architects-daughter:400|caveat:500|special-elite:400|ibm-plex-mono:400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mesa.css">
<script src="pieles.js"></script>
<style>
/* Portada: la mesa vacía con el rótulo de la lámina 0 y, a un lado, la mano
   de documentos (como el abanico de cartas de tarot). Pasar sobre uno viste
   la mesa con su piel; tocarlo la deja puesta. */
html,body{min-height:100%}
.plano{position:fixed;inset:0;z-index:-1;color:var(--line);opacity:.3;overflow:hidden}
.plano svg{width:100%;height:100%;overflow:hidden}
.esquina{position:fixed;right:16px;top:16px;z-index:10}

.portada{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:24px;padding:72px 48px 48px}

.lamina{max-width:560px;justify-self:end;display:grid;grid-template-columns:auto 1fr}
.lamina .titulo{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:18px 24px 10px;border-bottom:1.5px solid var(--text)}
.lamina .titulo img{width:76px;height:76px}
:root[data-theme="dark"] .lamina .titulo img{background:#EEF1F4;padding:4px}
.lamina h1{font-family:var(--cond);font-weight:700;font-size:112px;line-height:.85;letter-spacing:.03em}
.lamina .lema{grid-column:1/-1;padding:14px 24px;font-size:19px;line-height:1.4;border-bottom:1.5px solid var(--text)}
.lamina .lema b{font-weight:600}
.lamina .acciones{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;padding:16px 24px;border-bottom:1.5px solid var(--text)}
.lamina dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr}
.lamina dt{padding:5px 12px 5px 24px;font-family:var(--cond);font-size:14px;color:var(--text2);border-right:1px solid var(--line);border-top:1px solid var(--line)}
.lamina dd{padding:3px 24px 3px 12px;font-family:var(--mano);font-size:17px;border-top:1px solid var(--line)}
.lamina dt:first-of-type,.lamina dd:first-of-type{border-top:0}

/* La mano de documentos */
.mano-docs{position:relative;height:440px;list-style:none}
/* Como una mano de cartas: cada una encima de la anterior, así se lee la
   esquina de arriba (documento y enfoque) de todas. */
/* El botón es la zona de detección y no se mueve; solo sube la cara de
   adentro. Si subiera el botón, el cursor quedaría fuera de su caja y la
   carta bajaría y subiría sin parar. */
.carta{position:absolute;left:calc(50% + var(--dx));bottom:30px;width:190px;height:290px;margin-left:-95px;padding:0;border:0;background:none;
  transform-origin:50% 160%;rotate:var(--giro);cursor:pointer;text-align:left}
.carta:hover,.carta:focus-visible{z-index:20!important}
.carta:focus-visible{outline:none}
.cara{height:100%;padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  transition:translate .22s cubic-bezier(.2,.7,.2,1),background-color .3s}
.cara::before,.cara::after{display:none}
.carta:hover .cara,.carta:focus-visible .cara{translate:0 -40px}
.carta[aria-pressed="true"] .cara{translate:0 -24px;outline:2.5px solid var(--accent);outline-offset:3px}
.carta:focus-visible .cara{outline:2px solid var(--accent);outline-offset:2px}
.carta .tipo{font-family:var(--cond);font-weight:500;font-size:14px;color:var(--text2);border-bottom:1.5px solid var(--text);padding-bottom:4px}
.carta b{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.05}
.carta .pregunta{font-family:var(--mano);color:var(--accent);font-size:19px;line-height:1.2;margin-top:4px}
.carta .fuente{margin-top:auto}
.carta .tinta{height:10px;background:var(--film);margin-top:6px}
.ayuda{position:absolute;left:0;right:0;bottom:-38px;text-align:center;font-family:var(--mano);font-size:17px;color:var(--text2)}

@media (max-width:1000px){
  .portada{grid-template-columns:minmax(0,1fr);padding:72px 20px 40px;gap:40px}
  .lamina{justify-self:center;width:100%}
  .lamina h1{font-size:84px}
  /* En pantallas chicas la mano se vuelve una fila que se recorre de lado */
  .mano-docs{height:auto;display:flex;gap:14px;overflow-x:auto;padding:40px 4px 12px;scroll-snap-type:x mandatory}
  .carta{position:relative;left:auto;bottom:auto;margin:0;flex:none;rotate:0deg;scroll-snap-align:center;height:260px}
  .carta:hover .cara{translate:none}
  .ayuda{position:static;margin-top:4px}
}
@media (max-width:560px){
  .esquina{right:10px;top:10px}
  .portada{padding:64px 20px 32px}
  .lamina .titulo{padding:14px 16px 8px}.lamina .titulo img{width:52px;height:52px}
  .lamina h1{font-size:64px}
  .lamina .lema{padding:12px 16px;font-size:17px}
  .lamina .acciones{padding:14px 16px}
  .lamina dt{padding-left:16px}.lamina dd{padding-right:16px}
}
</style>
</head>
<body>
<div class="plano" aria-hidden="true"><svg id="plano"></svg></div>
<div class="esquina"><button class="modo" id="modo" type="button">Cianotipia</button></div>

<main class="portada">
  <section class="lamina pegado" aria-labelledby="t">
    <div class="titulo"><img src="../favicon.svg" alt=""><h1 id="t">MAPO</h1></div>
    <p class="lema">Gaiarda contesta <b>qué hay</b>. Mapo contesta <b>qué deberías hacer con eso</b>.</p>
    <div class="acciones">
      <a class="boton primario" href="#">Crear cuenta</a>
      <a class="boton" href="#">Iniciar sesión</a>
    </div>
    <dl>
      <dt>Lámina</dt><dd>0 · portada</dd>
      <dt>Fuentes</dt><dd>INEGI, SESNSP, OpenStreetMap</dd>
      <dt>Piel</dt><dd id="piel-actual">urbanismo · plano</dd>
    </dl>
  </section>

  <section aria-labelledby="t-mano">
    <h2 id="t-mano" class="sr">Preguntas por enfoque</h2>
    <ul class="mano-docs" id="mano"></ul>
    <p class="ayuda" id="ayuda"></p>
  </section>
</main>

<script src="datos.js"></script>
<script src="plano.js"></script>
<script>
const PREGUNTAS = {
  urbanismo: ["¿Qué zonas se quedan sin servicios públicos?", "Todas las capas"],
  demografia: ["¿En qué colonias vive la gente que quiero contratar?", "INEGI · Censo 2020"],
  comercio: ["¿En qué parte de la colonia falta una papelería?", "INEGI · DENUE"],
  consumo: ["¿Cuánto gasta al día un hogar de la región?", "INEGI · ENIGH"],
  seguridad: ["¿Qué delitos son más frecuentes en este municipio?", "SESNSP"],
  laboral: ["¿Hay gente buscando trabajo en el estado?", "INEGI · ENOE"],
  movilidad: ["¿Hasta dónde llego en diez minutos desde aquí?", "OSRM"],
};
const raiz = document.documentElement, {PIELES} = Mesa;
const ids = Object.keys(PIELES), mitad = (ids.length - 1) / 2;
let fijada = "urbanismo";

document.getElementById("mano").innerHTML = ids.map((id, i) => `
  <li><button type="button" class="carta" data-piel="${id}" aria-pressed="${id === fijada}"
      style="--giro:${((i - mitad) * 6).toFixed(1)}deg;--dx:${((i - mitad) * 44).toFixed(0)}px;z-index:${i + 1}">
    <span class="cara pegado" data-piel="${id}">
      <span class="tipo">${PIELES[id].documento}</span>
      <b>${PIELES[id].nombre}</b>
      <span class="pregunta">${PREGUNTAS[id][0]}</span>
      <span class="tinta" aria-hidden="true"></span>
      <span class="fuente">${PREGUNTAS[id][1]}</span>
    </span>
  </button></li>`).join("");

// Pasar encima previsualiza la piel; tocar la deja puesta (patrón de la galería de iroFactory).
let rotular = () => {};
function vestir(id) {
  raiz.dataset.piel = id;
  document.getElementById("piel-actual").textContent = `${PIELES[id].nombre.toLowerCase()} · ${PIELES[id].documento}`;
  rotular();
}
const mano = document.getElementById("mano");
mano.addEventListener("pointerover", e => { const c = e.target.closest(".carta"); if (c && e.pointerType === "mouse") vestir(c.dataset.piel); });
mano.addEventListener("pointerleave", () => vestir(fijada));
mano.addEventListener("focusin", e => { const c = e.target.closest(".carta"); if (c) vestir(c.dataset.piel); });
mano.addEventListener("focusout", e => { if (!mano.contains(e.relatedTarget)) vestir(fijada); });
mano.addEventListener("click", e => {
  const c = e.target.closest(".carta"); if (!c) return;
  fijada = c.dataset.piel;
  mano.querySelectorAll(".carta").forEach(x => x.setAttribute("aria-pressed", x === c));
  document.getElementById("ayuda").textContent = `piel fijada: ${PIELES[fijada].nombre.toLowerCase()}`;
  vestir(fijada);
});

dibujarPlano(document.getElementById("plano"), DATOS.coropleta);

document.getElementById("ayuda").textContent = matchMedia("(hover: none)").matches
  ? "toca un documento para ver su piel" : "pasa el cursor sobre un documento para ver su piel; haz clic para fijarla";
vestir(fijada);
rotular = Mesa.iniciarModo(document.getElementById("modo"));
</script>
</body>
</html>
