<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapo · mesa de planeación</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=barlow:400,500,600|barlow-condensed:500,700|architects-daughter:400|caveat:500|special-elite:400|ibm-plex-mono:400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="mesa.css">
<script src="pieles.js"></script>
<style>
/* /mapa: el plano ocupa la mesa entera; las capas son acetatos que se
   deslizan encima desde la charola del borde. La piel de la raíz sigue a la
   capa de arriba de la pila. */
html,body{height:100%}
body{overflow:hidden}

#mapa{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--sans);background:var(--bg)}
.leaflet-tile-pane{filter:url(#plano)}
.acetato{mix-blend-mode:var(--blend)}
.acetato.entra{animation:deslizar .42s cubic-bezier(.2,.7,.2,1)}
@keyframes deslizar{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.leaflet-bar{border:1.5px solid var(--text)!important;border-radius:0!important}
.leaflet-bar a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--line)!important;border-radius:0!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg) 85%,transparent)!important;color:var(--text2)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--text2)!important}
.leaflet-control-scale-line{background:var(--bg);color:var(--text);border:1.5px solid var(--text);border-top:0;font-family:var(--mono);font-size:11px}
.leaflet-tooltip{background:var(--bg);color:var(--text);border:1.5px solid var(--text);border-radius:0;box-shadow:none;font-family:var(--sans)}
.leaflet-tooltip::before{display:none}
.leaflet-tooltip.nota{background:var(--bg);border:0;font-family:var(--mano);font-size:17px;line-height:1.2;color:var(--accent);padding:3px 8px;rotate:-3deg}
.leaflet-top.leaflet-right{top:62px;right:6px}
.leaflet-bottom.leaflet-left{bottom:52px}

.membrete,.rotulo,.cinta,.esquina{position:fixed;z-index:1000}
.membrete{left:16px;top:16px}
.esquina{right:16px;top:16px}
.norte{position:fixed;z-index:900;right:22px;top:140px;width:46px;height:58px;color:var(--text)}

/* Rótulo de lámina: lo impreso a la izquierda, lo anotado a mano a la derecha */
.rotulo{right:16px;bottom:84px;display:grid;grid-template-columns:auto 1fr;min-width:250px}
.rotulo .titulo{grid-column:1/-1;padding:6px 12px 4px;border-bottom:1.5px solid var(--text);font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1}
.rotulo dt{padding:4px 12px;font-family:var(--cond);font-size:14px;color:var(--text2);border-right:1px solid var(--line);border-top:1px solid var(--line)}
.rotulo dd{padding:2px 12px;font-family:var(--mano);font-size:16px;border-top:1px solid var(--line)}
.rotulo dt:nth-of-type(1),.rotulo dd:nth-of-type(1){border-top:0}

/* Charola: los acetatos asoman por el borde de la mesa */
.charola{position:fixed;z-index:1000;left:0;right:0;bottom:0;display:flex;gap:6px;padding:0 16px;overflow-x:auto;pointer-events:none}
.pestana{pointer-events:auto;flex:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 14px 10px;margin-top:14px;
  background:var(--bg);border:1.5px solid var(--text);border-bottom:0;cursor:pointer;transform:translateY(8px);transition:transform .18s ease-out,background-color .3s}
.pestana:hover{transform:translateY(2px)}
.pestana[aria-pressed="false"]{background:var(--bg2);color:var(--text2)}
.pestana[aria-pressed="true"]{transform:none;margin-top:6px}
.pelicula{width:26px;height:18px;border:1.5px solid var(--text);background:var(--capa);opacity:.3}
.pestana[aria-pressed="true"] .pelicula{opacity:1}
.pestana b{font-family:var(--cond);font-weight:600;font-size:16px;white-space:nowrap}
.pestana em{font-style:normal;font-size:12px;color:var(--text2)}
.pestana.lapiz .pelicula{background:none;border-color:var(--accent);border-style:dashed}
.pestana.lapiz b{font-family:var(--mano);font-weight:400;font-size:17px;color:var(--accent)}

/* Cinta de la capa elegida: controles cortos en una tira, no un formulario */
.cinta{left:16px;bottom:84px;display:none;align-items:stretch;max-width:min(860px,calc(100% - 300px))}
.cinta[data-abierta="true"]{display:flex}
.cinta > *{padding:8px 14px;border-left:1px solid var(--line)}
.cinta > *:first-child{border-left:0}
.cinta h2{font-family:var(--cond);font-weight:700;font-size:19px;line-height:1.15}
.cinta .fuente{white-space:nowrap}
.campo{display:grid;gap:2px;font-family:var(--cond);font-size:14px;color:var(--text2)}
.campo select,.campo input{background:var(--bg);border:1.5px solid var(--line);border-radius:0;padding:3px 6px;min-height:32px;color:var(--text);font-family:var(--sans);font-size:14px}
.campo input{width:9ch}
.escala{display:grid;gap:3px;align-content:center}
.escala ol{display:flex;list-style:none}
.escala li{width:46px;height:14px;border:1px solid var(--line);margin-left:-1px;background:var(--capa)}
.escala li.nula{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 4px)}
.escala .marcas{display:flex;font-size:11px;color:var(--text2)}
.escala .marcas span{width:45px;white-space:nowrap}
.escala .marcas span:last-child{width:auto;padding-left:4px}
.texto{max-width:34ch;font-size:13px;color:var(--text2);align-self:center}
.acciones{display:flex;gap:6px;align-items:center}
.acciones button{white-space:nowrap;background:var(--bg);border:1.5px solid var(--line);padding:3px 10px;min-height:32px;cursor:pointer;font-family:var(--cond);font-size:15px}
.acciones button:hover{border-color:var(--text)}
.acciones button:disabled{opacity:.45;cursor:default}

@media (max-width:860px){
  /* La cinta sigue siendo una tira: se desliza de lado en vez de crecer hacia arriba. */
  .cinta{max-width:none;right:16px;bottom:66px;overflow-x:auto}
  .cinta > *{flex:none}
  .texto{min-width:26ch}
  .rotulo{display:none}
  .pestana em{display:none}
}
@media (max-width:560px){
  .membrete{left:10px;top:10px;right:10px}
  .esquina{right:10px;top:96px}
  .norte{top:auto;bottom:150px;right:14px;width:34px;height:44px}
  .cinta{left:10px;right:10px}
  .charola{padding:0 10px}
  .pestana{padding:6px 10px 8px}
  .leaflet-top.leaflet-right{top:136px}
}
@media (max-height:500px){
  .rotulo,.norte{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="plano" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer id="duotono"><feFuncR type="table"/><feFuncG type="table"/><feFuncB type="table"/></feComponentTransfer>
  </filter>
</svg>

<div id="mapa" role="region" aria-label="Plano de Guadalajara"></div>

<header class="membrete pegado">
  <a class="marca" href="#"><img src="../favicon.svg" alt=""><span>MAPO</span></a>
  <div class="membrete-datos">
    <nav class="secciones" aria-label="Secciones">
      <a href="#" aria-current="page">Mapa</a><a href="#">Perfil</a><a href="#">Logística</a>
    </nav>
    <div class="ubicacion">
      <label class="sr" for="estado">Estado</label>
      <select id="estado"><option>Jalisco</option></select>
      <span aria-hidden="true">/</span>
      <label class="sr" for="municipio">Municipio</label>
      <select id="municipio"><option>Guadalajara</option></select>
    </div>
  </div>
</header>

<div class="esquina">
  <label class="piel"><span>Piel</span><select id="piel" aria-label="Piel de la mesa"></select></label>
  <button class="modo" id="modo" type="button">Cianotipia</button>
</div>

<svg class="norte" viewBox="0 0 46 58" role="img" aria-label="Norte arriba">
  <text x="23" y="11" text-anchor="middle" font-size="12" font-family="Barlow Condensed" font-weight="700" fill="currentColor">N</text>
  <circle cx="23" cy="36" r="17" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M23 16 L29 40 L23 35 Z" fill="currentColor"/><path d="M23 16 L17 40 L23 35 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
</svg>

<dl class="rotulo pegado" aria-label="Rótulo de la lámina">
  <div class="titulo">Guadalajara, Jalisco</div>
  <dt>Lámina</dt><dd id="lamina"></dd>
  <dt>Fuentes</dt><dd id="fuentes"></dd>
  <dt>Documento</dt><dd id="documento"></dd>
  <dt>Fecha</dt><dd>29 de octubre de 2026</dd>
</dl>

<section class="cinta pegado" id="cinta" aria-live="polite"></section>
<nav class="charola" id="charola" aria-label="Acetatos"></nav>

<script src="leaflet.js"></script>
<script src="datos.js"></script>
<script>
const raiz = document.documentElement;
const css = n => getComputedStyle(raiz).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString("es-MX");

const {PIELES, rgb, mezcla, oscuro} = Mesa;
let fijada = null;   // null: la piel sigue a la capa de arriba
const pielActiva = () => fijada || capas.find(c => c.visible && c.enfoque)?.enfoque || "urbanismo";

// El mapa base se reimprime con las tintas de la piel (técnica de tanGo: retinte
// por filtro, sin servidor de teselas propio). Luminancia → color, por tramos.
function entintar(t) {
  const calles = oscuro() ? mezcla(t.bg2, t.line, 0.3) : mezcla(t.bg, "#F8F9FB", 0.7);
  const medio = oscuro() ? mezcla(t.bg2, t.bg, -0.4) : mezcla(t.bg2, t.line, 0.12);
  const stops = [[0, t.text], [0.45, t.line], [0.72, medio], [0.9, t.bg], [1, calles]];
  const tramos = stops.map(([x, h]) => [x, rgb(h)]);
  const valor = (t, c) => {
    let k = 1; while (tramos[k][0] < t) k++;
    const [t0, a] = tramos[k - 1], [t1, b] = tramos[k], f = (t - t0) / (t1 - t0);
    return (a[c] + (b[c] - a[c]) * f).toFixed(3);
  };
  const muestras = Array.from({length: 41}, (_, i) => i / 40);
  [...document.getElementById("duotono").children].forEach((fn, c) =>
    fn.setAttribute("tableValues", muestras.map(t => valor(t, c)).join(" ")));
}

const valores = DATOS.coropleta.features.map(f => f.properties.valor_choropleth).filter(v => v != null).sort((a, b) => a - b);
const cortes = [0.2, 0.4, 0.6, 0.8].map(q => valores[Math.floor(q * (valores.length - 1))]);
const clase = v => v == null ? -1 : cortes.filter(c => v > c).length;
const tinta = [0.12, 0.26, 0.42, 0.6, 0.8];
const nulos = DATOS.coropleta.features.length - valores.length;

// Tus marcas: la celda de Voronoi más grande cerca del centro, encerrada en lápiz rojo.
const area = anillo => Math.abs(anillo.reduce((s, [x1, y1], i) => { const [x2, y2] = anillo[(i + 1) % anillo.length]; return s + x1 * y2 - x2 * y1; }, 0)) / 2;
const centro = [20.6767, -103.3475];
const candidata = DATOS.voronoi.features
  .map(f => ({f, a: area(f.geometry.coordinates[0]), d: Math.hypot(f.properties.lat - centro[0], f.properties.lon - centro[1])}))
  .filter(x => x.d < 0.05).sort((x, y) => y.a - x.a)[0].f;

const capas = [
  {id: "marcas", nombre: "Tus marcas", fuente: "a mano, del equipo", color: "--accent", visible: true, lapiz: true},
  {id: "isocrona", nombre: "Alcance en auto", fuente: DATOS.isocrona.metodo === "osrm_real" ? "OSRM · carretera real" : "OSRM · círculo aproximado", enfoque: "movilidad", color: "--f-movilidad", visible: false},
  {id: "voronoi", nombre: "Área por papelería", fuente: `DENUE · ${fmt(DATOS.voronoi.features.length)} negocios`, enfoque: "comercio", color: "--f-comercio", visible: true},
  {id: "coropleta", nombre: "Población", fuente: `INEGI · Censo 2020 · ${DATOS.coropleta.features.length} AGEB`, enfoque: "demografia", color: "--f-demografia", visible: true},
];
let elegida = "coropleta";

const mapa = L.map("mapa", {zoomControl: false, attributionControl: true}).setView(centro, 12);
L.control.zoom({position: "topright"}).addTo(mapa);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© colaboradores de OpenStreetMap"}).addTo(mapa);
L.control.scale({imperial: false, position: "bottomleft"}).addTo(mapa);

// Contorno a mano: un círculo con temblor fijo, como trazado con lápiz.
function trazoAMano(latlng, radioPx) {
  const p = mapa.latLngToLayerPoint(latlng), pts = [];
  for (let i = 0; i <= 38; i++) {
    const a = i / 36 * Math.PI * 2, r = radioPx * (1 + 0.06 * Math.sin(i * 2.3) + 0.03 * Math.cos(i * 5.1));
    pts.push(mapa.layerPointToLatLng([p.x + Math.cos(a) * r * 1.25, p.y + Math.sin(a) * r]));
  }
  return pts;
}

const hechas = {};
function construir() {
  Object.values(hechas).forEach(l => mapa.removeLayer(l));
  capas.forEach(c => {
    const pane = "p-" + c.id;
    if (!mapa.getPane(pane)) mapa.createPane(pane).classList.add("acetato");
    const color = css(c.color), renderer = L.svg({pane});
    let capa;
    if (c.id === "coropleta") {
      const factor = oscuro() ? 0.85 : 1;
      capa = L.geoJSON(DATOS.coropleta, {pane, renderer, style: f => {
        const k = clase(f.properties.valor_choropleth);
        return {color, weight: 0.5, opacity: 0.6, fillColor: color, fillOpacity: k < 0 ? 0 : tinta[k] * factor};
      }}).bindTooltip(l => {
        const v = l.feature.properties.valor_choropleth;
        return `AGEB <span class="num">${l.feature.properties.cvegeo}</span><br><span class="num">${v == null ? "sin dato" : fmt(v)}</span> personas`;
      }, {sticky: true});
    } else if (c.id === "voronoi") {
      const celdas = L.geoJSON(DATOS.voronoi, {pane, renderer, style: {color, weight: 0.8, opacity: 0.9, fill: false}});
      const puntos = L.layerGroup(DATOS.voronoi.features.map(f =>
        L.circleMarker([f.properties.lat, f.properties.lon], {pane, renderer, radius: 2.2, stroke: false, fillColor: color, fillOpacity: 1}).bindTooltip(f.properties.nombre)));
      const conPuntos = () => mapa.getZoom() >= 14 && mapa.hasLayer(capa) ? puntos.addTo(mapa) : puntos.remove();
      mapa.off("zoomend", c.alZoom); c.alZoom = conPuntos; mapa.on("zoomend", conPuntos);
      capa = L.layerGroup([celdas]); capa.on("add remove", () => setTimeout(conPuntos));
    } else if (c.id === "isocrona") {
      const anillos = [4, 9, 14].map(r => L.circleMarker(centro, {pane, renderer, radius: r, color, weight: 1.3, fill: false}));
      capa = L.layerGroup([
        L.geoJSON(DATOS.isocrona.poligono, {pane, renderer, style: {color, weight: 2, dashArray: "6 4", fillColor: color, fillOpacity: 0.2}}),
        ...anillos,
      ]);
    } else {
      const p = candidata.properties, sitio = [p.lat, p.lon];
      const contorno = L.polyline(trazoAMano(sitio, 34), {pane, renderer, color, weight: 2.4, lineCap: "round"});
      contorno.bindTooltip("¿papelería aquí?<br>lejos de las demás", {permanent: true, direction: "right", offset: [44, 0], className: "nota"});
      capa = L.layerGroup([contorno]);
      mapa.off("zoomend", c.alZoom); c.alZoom = () => contorno.setLatLngs(trazoAMano(sitio, 34)); mapa.on("zoomend", c.alZoom);
    }
    hechas[c.id] = capa;
    if (c.visible) capa.addTo(mapa);
  });
  apilar();
}
const apilar = () => capas.forEach((c, i) => mapa.getPane("p-" + c.id).style.zIndex = 460 - i);

function escala() {
  const lim = [valores[0], ...cortes, valores[valores.length - 1]];
  return `<div class="escala" aria-label="Personas por AGEB, en quintiles">
    <ol>${tinta.map(t => `<li style="opacity:${t}"></li>`).join("")}<li class="nula" title="Sin dato"></li></ol>
    <div class="marcas num">${lim.slice(0, 5).map(v => `<span>${fmt(v)}</span>`).join("")}<span>sin dato: ${nulos}</span></div></div>`;
}
const control = {
  coropleta: () => `<label class="campo">Indicador<select><option>Población total</option><option>Población de 15 a 64</option><option>Viviendas habitadas</option></select></label>${escala()}`,
  voronoi: () => `<label class="campo">Giro contiene<input value="papel"></label><p class="texto">Cada celda agrupa lo que queda más cerca de esa papelería que de otra. Celda grande, poca oferta.</p>`,
  isocrona: () => `<label class="campo">Minutos<input type="number" value="10" min="1" max="60" class="num"></label><p class="texto">Hasta dónde llegas en auto desde un punto. El punto se pone con un clic.</p>`,
  marcas: () => `<p class="texto">Lo que decide tu equipo va a mano sobre los datos: <span class="mano">círculos, notas, flechas</span>. Lo impreso no se toca.</p>`,
};

function pintar() {
  const ch = document.getElementById("charola");
  ch.innerHTML = capas.map(c => `
    <button type="button" class="pestana ${c.lapiz ? "lapiz" : ""}" data-id="${c.id}" aria-pressed="${c.visible}" style="--capa:var(${c.color})">
      <span class="pelicula" aria-hidden="true"></span><b>${c.nombre}</b><em>${c.visible ? "encima" : "en la charola"}</em>
    </button>`).join("");
  const c = capas.find(x => x.id === elegida), i = capas.indexOf(c);
  const cinta = document.getElementById("cinta");
  cinta.dataset.abierta = Boolean(c && c.visible);
  if (c) cinta.innerHTML = `
    <div><h2>${c.nombre}</h2><p class="fuente">${c.fuente}</p></div>
    ${control[c.id]()}
    <div class="acciones">
      <button type="button" data-mover="-1" ${i === 0 ? "disabled" : ""}>Más arriba</button>
      <button type="button" data-mover="1" ${i === capas.length - 1 ? "disabled" : ""}>Más abajo</button>
      <button type="button" data-quitar>Quitar</button>
    </div>`;
  const activas = capas.filter(x => x.visible && !x.lapiz);
  document.getElementById("lamina").textContent = `${activas.length} ${activas.length === 1 ? "acetato" : "acetatos"}`;
  document.getElementById("fuentes").textContent = [...new Set(activas.map(x => x.fuente.split(" · ")[0]))].join(", ") || "ninguna";
}

function poner(c, visible) {
  c.visible = visible;
  if (visible) {
    hechas[c.id].addTo(mapa);
    const pane = mapa.getPane("p-" + c.id);
    pane.classList.remove("entra"); void pane.offsetWidth; pane.classList.add("entra");
  } else mapa.removeLayer(hechas[c.id]);
}
document.getElementById("charola").addEventListener("click", e => {
  const b = e.target.closest(".pestana"); if (!b) return;
  const c = capas.find(x => x.id === b.dataset.id);
  if (!c.visible) { poner(c, true); elegida = c.id; }
  else if (elegida !== c.id) elegida = c.id;
  else poner(c, false);
  quizaCambiarPiel(); pintar();
});
document.getElementById("cinta").addEventListener("click", e => {
  const c = capas.find(x => x.id === elegida);
  if (e.target.matches("[data-quitar]")) { poner(c, false); quizaCambiarPiel(); pintar(); return; }
  const d = Number(e.target.dataset.mover); if (!d) return;
  const i = capas.indexOf(c); [capas[i], capas[i + d]] = [capas[i + d], capas[i]];
  apilar(); quizaCambiarPiel(); pintar();
});

// Aplica la piel: data-piel en la raíz (las reglas las genera pieles.js),
// mapa base reentintado y capas redibujadas con sus películas.
const selector = document.getElementById("piel");
let rotularModo = () => {};
function aplicar() {
  const id = pielActiva(), piel = PIELES[id], t = piel[oscuro() ? "noche" : "dia"];
  raiz.dataset.piel = id;
  rotularModo();
  const auto = capas.find(c => c.visible && c.enfoque)?.enfoque || "urbanismo";
  selector.innerHTML = `<option value="">Automática · ${PIELES[auto].nombre}</option>` +
    Object.entries(PIELES).map(([k, p]) => `<option value="${k}" ${fijada === k ? "selected" : ""}>${p.nombre}</option>`).join("");
  document.getElementById("documento").textContent = piel.documento;
  entintar(t);
  construir();
}
let pielPintada = null;
function quizaCambiarPiel() { if (pielActiva() !== pielPintada) { pielPintada = pielActiva(); aplicar(); } }
selector.addEventListener("change", () => { fijada = selector.value || null; pielPintada = pielActiva(); aplicar(); pintar(); });

rotularModo = Mesa.iniciarModo(document.getElementById("modo"), () => { aplicar(); pintar(); });
pielPintada = pielActiva(); aplicar();
mapa.fitBounds(hechas.coropleta.getBounds(), {paddingTopLeft: [20, 90], paddingBottomRight: [20, 150]});
pintar();
</script>
</body>
</html>
